spring:
  application:
    name: whatsapp-messaging

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:whatsapp}
    username: ${POSTGRES_USER:whatsapp}
    password: ${POSTGRES_PASSWORD:whatsapp}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
      idle-timeout: 600000

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: whatsapp
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ankitsriv89.whatsapp.dto"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  security:
    user:
      password: disabled

server:
  port: 8101

whatsapp:
  jwt:
    secret: ${JWT_SECRET:whatsapp-dev-secret-at-least-32-bytes-long!!}
    expiry-minutes: 1440
  # Per-chat message ordering and delivery tuning. The server stores ciphertext
  # plus delivery metadata only — see docs/architecture.md for the E2EE boundary.
  delivery:
    # How long an undelivered message stays in the offline backlog before expiry.
    backlog-ttl-hours: 720
    # Max messages drained per /v1/sync page.
    sync-page-size: 200
  session:
    # Redis TTL (seconds) for an active device route. Refreshed on heartbeat.
    route-ttl-seconds: 90
  kafka:
    topic:
      messages: whatsapp.messages
      receipts: whatsapp.receipts

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.ankitsriv89.whatsapp: INFO
