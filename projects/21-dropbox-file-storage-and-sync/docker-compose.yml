services:
  app:
    build: .
    image: dropbox-file-storage-and-sync:latest
    container_name: dropbox-file-storage-and-sync
    ports:
      - "8102:8102"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dropbox
      SPRING_DATASOURCE_USERNAME: dropbox
      SPRING_DATASOURCE_PASSWORD: dropbox
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: dropbox-files
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      API_KEY: ${API_KEY:-demo-secret}
      SERVER_PORT: 8102
      MANAGEMENT_SERVER_PORT: 8102
    networks:
      - infra
    restart: unless-stopped

networks:
  infra:
    external: true
