spring:
  application:
    name: news-feed-system

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/newsfeed
    username: newsfeed
    password: ${POSTGRES_PASSWORD:newsfeed}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
      idle-timeout: 600000

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: newsfeed-fanout
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ankitsriv89.newsfeed.dto"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  security:
    user:
      password: disabled

server:
  port: 8097

newsfeed:
  jwt:
    secret: ${JWT_SECRET:news-feed-dev-secret-at-least-32-bytes-long}
    expiry-minutes: 1440
  # Authors with more followers than this threshold are NOT fanned out on write.
  # Their posts are pulled at read time instead (fanout-on-read), avoiding the
  # "celebrity fanout" write amplification problem. See FanoutService.
  fanout:
    celebrity-threshold: 1000
  feed:
    # How many materialized items to keep per user timeline in Redis.
    max-cached-items: 800
    page-size: 20
  ranking:
    # Recency half-life in hours for the time-decay component of the feed score.
    half-life-hours: 12
  kafka:
    topic:
      events: newsfeed.events

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.ankitsriv89.newsfeed: INFO
