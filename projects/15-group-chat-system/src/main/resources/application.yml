spring:
  application:
    name: group-chat-system

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/groupchat
    username: groupchat
    password: ${POSTGRES_PASSWORD:groupchat}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
      idle-timeout: 600000

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: groupchat-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ankitsriv89.groupchat.dto"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  security:
    user:
      password: disabled

server:
  port: 8096

groupchat:
  jwt:
    secret: ${JWT_SECRET:group-chat-dev-secret-at-least-32-bytes-long}
    expiry-minutes: 1440
  presence:
    ttl-seconds: 30
  kafka:
    topic:
      messages: groupchat.messages
      events: groupchat.events

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.ankitsriv89.groupchat: INFO
    org.springframework.web.socket: WARN
