server:
  port: 8099

spring:
  application:
    name: instagram

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:instagram}
    username: ${POSTGRES_USER:instagram}
    password: ${POSTGRES_PASSWORD:instagram}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: instagram
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ankitsriv89.instagram.*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

instagram:
  media:
    # S3-compatible origin (MinIO). Cloudflare CDN fronts public-base-url in prod.
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:instagram}
      secret-key: ${MINIO_SECRET_KEY:instagram123}
      bucket: ${MINIO_BUCKET:media}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:/p18/media}
    # Variants generated asynchronously by the processing worker.
    variants:
      thumbnail-px: 150
      small-px: 320
      medium-px: 640
  feed:
    redis-key-prefix: "feed:"
    max-size: 500
    fanout-follower-threshold: 10000   # above this, pull-model for "celebrity" accounts
  kafka:
    topics:
      media-uploaded: media.uploaded
      media-processed: media.processed
      post-created: post.created
      post-liked: post.liked

logging:
  level:
    com.ankitsriv89.instagram: DEBUG
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} request_id=%X{requestId} - %msg%n"
