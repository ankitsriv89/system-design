# docker-compose.yml — URL Shortener project stack
#
# Prerequisites: the shared infrastructure must be running before starting this stack.
# From the repo root:  docker compose -f infra/docker-compose.yml up -d
#
# Then start this project:  docker compose up -d
#
# The server connects to the shared postgres container on the `infra` network.
# No Redis; URL cache is in-process (resets on restart — fine for a demo/learning project).

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      LISTEN_ADDR: ":8081"
      # BASE_URL should be overridden in production to your public domain,
      # e.g. BASE_URL=https://url.yourdomain.com
      BASE_URL: "http://localhost:8081"
      # Connects to the shared postgres container on the infra network.
      # Override DATABASE_URL if your postgres runs elsewhere.
      DATABASE_URL: "postgres://url:url@postgres:5432/urlshortener?sslmode=disable"
    networks:
      - default
      - infra
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - server

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:

networks:
  default: {}
  # infra is an external network created by infra/docker-compose.yml.
  # It carries the shared postgres container reachable as hostname "postgres".
  infra:
    external: true
