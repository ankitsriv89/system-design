# docker-compose.yml — URL Shortener project stack
#
# Prerequisites: shared infra must be running first.
#   docker compose -f infra/docker-compose.yml up -d
#
# Then start this project:
#   docker compose up -d

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      LISTEN_ADDR: ":8085"
      BASE_URL: "http://localhost:8085"
      DATABASE_URL: "postgres://url:url@postgres:5432/urlshortener?sslmode=disable"
    networks:
      - default
      - infra
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default: {}
  infra:
    external: true
