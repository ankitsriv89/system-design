# docker-compose.yml — Pastebin project stack
#
# Prerequisites: shared infra must be running first.
#   docker compose -f infra/docker-compose.yml up -d
#
# Provision the database (one-time):
#   docker exec -it infra-postgres-1 psql -U admin -c "CREATE DATABASE pastebin;"
#   docker exec -it infra-postgres-1 psql -U admin -c "CREATE USER paste WITH PASSWORD 'paste';"
#   docker exec -it infra-postgres-1 psql -U admin -c "GRANT ALL PRIVILEGES ON DATABASE pastebin TO paste;"
#
# Run migrations:
#   docker compose run --rm server sh -c "psql $DATABASE_URL -f /dev/stdin" < scripts/migrate.sql
#
# Then start:
#   docker compose up -d

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      LISTEN_ADDR: ":8082"
      DATABASE_URL: "postgres://paste:paste@postgres:5432/pastebin?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      MINIO_USE_SSL: "false"
      SWEEP_INTERVAL: "1m"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - default
      - infra
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minio_data:

networks:
  default: {}
  infra:
    external: true
