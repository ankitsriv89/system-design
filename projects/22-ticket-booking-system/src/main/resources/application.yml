spring:
  application:
    name: ticket-booking

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ticketbooking}
    username: ${POSTGRES_USER:ticketbooking}
    password: ${POSTGRES_PASSWORD:ticketbooking}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: ticket-booking
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ankitsriv89.ticketbooking.service"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8103

ticket-booking:
  hold-ttl-seconds: 300
  expiry-check-ms: 10000
  kafka:
    topic:
      holds: ticket.holds
      bookings: ticket.bookings

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.ankitsriv89.ticketbooking: INFO
