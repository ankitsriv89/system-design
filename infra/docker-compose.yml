# infra/docker-compose.yml — Shared infrastructure for all projects on this host.
#
# This compose file runs once on the Oracle Cloud ARM VM and stays up permanently.
# All project-level compose files attach to the `infra` network and reach
# these services by their container hostname (e.g. "postgres").
#
# One-time start (from the repo root):
#   docker compose -f infra/docker-compose.yml up -d
#
# To create a new project database:
#   docker exec -it infra-postgres-1 psql -U admin -c "CREATE DATABASE myproject;"
#   docker exec -it infra-postgres-1 psql -U admin -c "CREATE USER myuser WITH PASSWORD 'mypassword';"
#   docker exec -it infra-postgres-1 psql -U admin -c "GRANT ALL PRIVILEGES ON DATABASE myproject TO myuser;"
#
# Prometheus scrapes all project API servers via host.docker.internal.
# Projects do not need their own Prometheus/Grafana — add a scrape job to
# infra/prometheus/prometheus.yml and drop the dashboard JSON in
# infra/grafana/dashboards/ when building a new project.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - infra

  prometheus:
    image: prom/prometheus:v3.12.0
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - infra

  grafana:
    image: grafana/grafana:13.0.1
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - infra

  # Exports host-level metrics: CPU, memory, disk, network, uptime.
  # Runs in host PID/network namespace so it can see the real system counters.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    pid: host
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  infra:
    name: infra
