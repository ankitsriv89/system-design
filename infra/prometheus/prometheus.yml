global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host system metrics: CPU, memory, disk, network, uptime (via node-exporter).
  # node-exporter uses host networking so it's reachable on the host loopback.
  - job_name: node
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: 01-rate-limiter
    static_configs:
      - targets: ["host.docker.internal:8081"]
    metrics_path: /metrics

  - job_name: 02-url-shortener
    static_configs:
      - targets: ["host.docker.internal:8082"]
    metrics_path: /metrics

  - job_name: 03-pastebin
    static_configs:
      - targets: ["host.docker.internal:8082"]
    metrics_path: /metrics

  - job_name: 04-unique-id-generator
    static_configs:
      - targets: ["host.docker.internal:8083"]
    metrics_path: /metrics
