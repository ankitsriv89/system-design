#cloud-config
# =============================================================================
# cloud-init.yaml — Runs on first boot of the OCI VM
#
# Purpose: minimal hardening + clone the repo so setup.sh can be run
# immediately after SSH. The actual software installation (Docker, Caddy,
# postgres) is handled by infra/setup.sh to keep cloud-init simple.
# =============================================================================

package_update: true
package_upgrade: true

packages:
  - git
  - curl
  - wget
  - ca-certificates
  - ufw
  - htop
  - fail2ban

# ── SSH hardening ─────────────────────────────────────────────────────────────
write_files:
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      # Disable password auth — key-only SSH
      PasswordAuthentication no
      ChallengeResponseAuthentication no
      # Disable root login
      PermitRootLogin no
      # Only allow the ubuntu user
      AllowUsers ubuntu
      # Shorter timeout for idle connections
      ClientAliveInterval 300
      ClientAliveCountMax 2

  - path: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime  = 3600
      findtime = 600
      maxretry = 5

      [sshd]
      enabled = true
      port    = ssh
      logpath = %(sshd_log)s
      backend = %(syslog_backend)s

runcmd:
  # Restart SSH with new config
  - systemctl restart sshd
  # Start fail2ban
  - systemctl enable --now fail2ban

  # Clone the repo so it is ready when you SSH in
  - git clone ${repo_url} /home/ubuntu/system-design
  - chown -R ubuntu:ubuntu /home/ubuntu/system-design

  # ufw: open only SSH + HTTP + HTTPS
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

final_message: |
  ============================================================
  cloud-init complete. SSH in and run:
    bash ~/system-design/infra/setup.sh
  ============================================================
